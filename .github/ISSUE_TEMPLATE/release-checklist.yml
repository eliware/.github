name: Release checklist
description: Record release inspections, authorization, publication, deployment, and results.
title: "Release checklist"
body:
  - type: markdown
    attributes:
      value: >-
        The project agent creates this issue after TagIt preflight passes. Include the release
        version in the issue title. Record each project check with its source commit or issue
        snapshot date and result. Earlier checks need not name the final candidate. QA verifies
        each source commit and confirms that it is an ancestor of the final candidate. Use the
        final candidate for Marketing, QA, release approval, and publication. Follow [Operations
        directives E-12.6 and E-12.7](https://github.com/eliware/operations/blob/main/specs/directives.yaml).
        Use the repository name as the project owner. Explain why a step does not apply in the
        records fields. A blank required box blocks handoff. This checklist does not
        authorize release or deployment. Keep this issue open until all required records are complete.

  - type: textarea
    id: release-scope
    attributes:
      label: Release scope
      description: Name the repository, version, target, and release scope. Use the repository name as the project owner.
      placeholder: Include the repository name as project owner and describe the release scope.
    validations:
      required: true

  - type: input
    id: candidate-commit
    attributes:
      label: Final candidate commit
      description: Record the full commit SHA that passed npm test, CI, and TagIt preflight.
      placeholder: Full final candidate SHA
    validations:
      required: true

  - type: dropdown
    id: change-class
    attributes:
      label: Release class
      description: Set every v13 release class to Major. Derive other classes from the target version.
      options:
        - Major
        - Minor
        - Patch
    validations:
      required: true

  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight and candidate readiness
      description: Record each completed project check. Link its source commit and result in Preflight records.
      options:
        - label: Run npm outdated. Install latest versions, then run npm update and npm install.
        - label: Resolve all open release-scope issues and link the issues.
        - label: Complete and verify comprehensive end-user documentation in docs/.
        - label: Remove README.md and AGENTS.md content that conventions do not require.
        - label: For applications and libraries, open and close a scoped refactoring issue. Link it in Preflight records.
        - label: For applications and libraries, run codescope refactor and apply its recommendations.
        - label: For other profiles, record why refactoring does not apply.
        - label: Run npm test and commit after refactoring.
        - label: Run codescope all and fix its reported issues.
        - label: If changes result, run npm test and commit them.
        - label: Do not run CodeScope again.
        - label: Record its source commit. Mark CodeScope complete when Eli says it is done.
        - label: Record focused validation and full npm test results.
        - label: Run tagit notes and update release notes with today's date and all changes since the previous tag.
        - label: Run npm test, commit the release notes, and push the final candidate.
        - label: Confirm CI passes and TagIt preflight passes for the final candidate.
        - label: Confirm that the release class matches the target version.
        - label: Update the final candidate SHA and release notes after each later change.
        - label: Rerun npm test, CI, and TagIt after each later candidate change.

  - type: textarea
    id: preflight-records
    attributes:
      label: Preflight records
      description: Record each gate's source commit or issue snapshot date. Earlier records may name other revisions.
      placeholder: Include dependency updates, issue results, docs and README checks, refactoring issue or reason it does not apply, CodeScope SHA and status, tests, CI, TagIt notes, and final preflight SHA.
    validations:
      required: true

  - type: checkboxes
    id: marketing
    attributes:
      label: Marketing inspection
      description: Marketing records its README presentation inspection here. Link findings and results.
      options:
        - label: Marketing inspected README presentation, branding, links, and public copy for the candidate commit.
        - label: Marketing confirmed the final candidate has the inspected README or inspected it again.
        - label: Resolve each Marketing finding or record that no finding remains open.
        - label: Confirm if Marketing changes required a new inspection and record the result.
        - label: Confirm that later changes did not alter the inspected candidate, or link updated checks.

  - type: textarea
    id: marketing-evidence
    attributes:
      label: Marketing records
      description: Record the first inspection result, candidate commit, and links to any findings.
      placeholder: Include the full commit SHA and initial inspection result.
    validations:
      required: true

  - type: checkboxes
    id: qa
    attributes:
      label: QA inspection
      description: Ask QA to inspect the final candidate after Marketing completes.
      options:
        - label: QA verified each project-check source commit or issue snapshot date and result.
        - label: QA confirmed each source commit is an ancestor of the final candidate.
        - label: QA inspected applicable conventions on the final candidate commit.
        - label: Record QA approval for the exact final commit.
        - label: Resolve each QA finding or record that QA found none.
        - label: Confirm that QA reviewed the final candidate after any later presentation change.

  - type: textarea
    id: qa-evidence
    attributes:
      label: QA records
      description: Add the approved commit SHA and links to the QA inspection and follow-up issues.
      placeholder: Include the final candidate SHA, each source commit or issue snapshot date, verification results, and inspection result.

  - type: checkboxes
    id: approval-and-publication
    attributes:
      label: Release approval and publication
      description: Complete these steps after Marketing and QA sign off on the same commit.
      options:
        - label: Eli gave release authorization for the commit that Marketing and QA inspected.
        - label: DevOps published the release after Eli's authorization.
        - label: DevOps recorded publication details in this issue.
        - label: DevOps updated the Docs repository map.

  - type: textarea
    id: approval-publication-records
    attributes:
      label: Authorization and publication records
      description: Add Eli's authorization, publication details, and the updated repository map.
      placeholder: Record release version, publication commit, and relevant links.

  - type: dropdown
    id: deployment-required
    attributes:
      label: Deployment requirement
      description: Record if this release changes a deployed system.
      options:
        - No deployment is required
        - Deployment is required
    validations:
      required: true

  - type: checkboxes
    id: deployment-handoff
    attributes:
      label: Deployment handoff
      description: Complete these gates only when deployment is required.
      options:
        - label: Complete the approved deployment handoff or record why no deployment applies.

  - type: textarea
    id: deployment-records
    attributes:
      label: Deployment records
      description: Add Eli's handoff authorization, rollout results, and any follow-up issues.
      placeholder: Record why no deployment applies, or add the approval, rollout status, and links.
    validations:
      required: true

  - type: checkboxes
    id: closure
    attributes:
      label: Closure
      description: Complete this gate after every applicable release and deployment record is complete.
      options:
        - label: DevOps confirmed that all required gates are complete and closed this issue.
