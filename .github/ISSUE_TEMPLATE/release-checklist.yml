name: Release checklist
description: Record release inspections, authorization, publication, deployment, and results.
title: "Release checklist"
body:
  - type: markdown
    attributes:
      value: >-
        After TagIt preflight passes, Marketing completes its first presentation and branding
        inspection. Marketing creates or initializes this issue after that inspection. Follow the
        project procedure and [Operations directives E-12.6 and E-12.7](https://github.com/eliware/operations/blob/main/specs/directives.yaml).
        The assigned role completes its section and links records. A blank box is incomplete.
        Explain why a step does not apply in the records fields. This checklist does not
        authorize release or deployment. Keep this issue open until all required records are complete.

  - type: textarea
    id: release-scope
    attributes:
      label: Release scope
      description: Name the repository, version, project owner, target, and release scope.
      placeholder: Include the change class, release scope, and why it applies.
    validations:
      required: true

  - type: input
    id: candidate-commit
    attributes:
      label: Candidate commit
      description: Record the full commit SHA that passed TagIt preflight.
      placeholder: Full commit SHA
    validations:
      required: true

  - type: dropdown
    id: change-class
    attributes:
      label: Change class
      description: Classify the candidate under Operations directive E-12.6.
      options:
        - Substantial
        - Minor
    validations:
      required: true

  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight and candidate readiness
      description: The owner completes these gates before QA inspection. Link results in Preflight records.
      options:
        - label: Resolve all open release-scope issues and link the issues.
        - label: Record the refactoring result and link its issue, or state why it does not apply.
        - label: Record two clean CodeScope runs, or explain a permitted minor-change skip.
        - label: Resolve each CodeScope finding or record that no repair was required.
        - label: Record focused validation and full npm test results.
        - label: Push the candidate and link passing CI for its exact commit.
        - label: Pass TagIt preflight for the exact candidate commit.
        - label: Record the change class and why it applies.
        - label: Rerun each affected gate after a candidate change and update its records.

  - type: textarea
    id: preflight-records
    attributes:
      label: Preflight records
      description: Link each result. State why a step does not apply and name its owner.
      placeholder: Include issue links, CodeScope results, tests, CI, TagIt, full commit SHA, and why each step does not apply.
    validations:
      required: true

  - type: checkboxes
    id: marketing
    attributes:
      label: Marketing inspection
      description: Complete Marketing inspection before QA inspection. Link findings and results.
      options:
        - label: Marketing inspected presentation and branding for the candidate commit.
        - label: Resolve each Marketing finding or record that no finding remains open.
        - label: Confirm if Marketing changes required a new inspection and record the result.
        - label: Confirm that later changes did not alter the inspected candidate, or link updated checks.

  - type: textarea
    id: marketing-evidence
    attributes:
      label: Marketing records
      description: Record the first inspection result, candidate commit, and links to any findings.
      placeholder: Include the full commit SHA and initial inspection result.
    validations:
      required: true

  - type: checkboxes
    id: qa
    attributes:
      label: QA inspection
      description: Ask QA to inspect the final candidate after Marketing completes.
      options:
        - label: QA inspected applicable conventions on the final candidate commit.
        - label: Record QA approval for the exact final commit.
        - label: Resolve each QA finding or record that QA found none.
        - label: Confirm that QA reviewed the final candidate after any later presentation change.

  - type: textarea
    id: qa-evidence
    attributes:
      label: QA records
      description: Add the approved commit SHA and links to the QA inspection and follow-up issues.
      placeholder: Include the full commit SHA and inspection result.

  - type: checkboxes
    id: approval-and-publication
    attributes:
      label: Release approval and publication
      description: Complete these steps after Marketing and QA sign off on the same commit.
      options:
        - label: Eli gave release authorization for the commit that Marketing and QA inspected.
        - label: DevOps published the release after Eli's authorization.
        - label: DevOps recorded publication details in this issue.
        - label: DevOps updated the Docs repository map.

  - type: textarea
    id: approval-publication-records
    attributes:
      label: Authorization and publication records
      description: Add Eli's authorization, publication details, and the updated repository map.
      placeholder: Record release version, publication commit, and relevant links.

  - type: dropdown
    id: deployment-required
    attributes:
      label: Deployment requirement
      description: Record if this release changes a deployed system.
      options:
        - No deployment is required
        - Deployment is required
    validations:
      required: true

  - type: checkboxes
    id: deployment-handoff
    attributes:
      label: Deployment handoff
      description: Complete these gates only when deployment is required.
      options:
        - label: Complete the approved deployment handoff or record why no deployment applies.

  - type: textarea
    id: deployment-records
    attributes:
      label: Deployment records
      description: Add Eli's handoff authorization, rollout results, and any follow-up issues.
      placeholder: Record why no deployment applies, or add the approval, rollout status, and links.
    validations:
      required: true

  - type: checkboxes
    id: closure
    attributes:
      label: Closure
      description: Complete this gate after every applicable release and deployment record is complete.
      options:
        - label: DevOps confirmed that all required gates are complete and closed this issue.
