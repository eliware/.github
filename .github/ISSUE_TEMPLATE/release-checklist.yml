name: Release checklist
description: Record project readiness, cross-role reviews, authorization, publication, and deployment.
title: "Release checklist"
body:
  - type: markdown
    attributes:
      value: >-
        The project agent opens and owns this issue at the start of release work, before readiness
        checks. Include the release version in the title. Record readiness results as work proceeds.
        Add the full candidate commit after project checks pass and before cross-role review. Keep
        the follow-up candidate separate from any previously published tag. Eli sends the completed
        checklist to Operations. Operations coordinates Marketing, QA, DevOps, and GitOps when
        deployment applies.

        The project owner can commit and push corrective fixes while a gate fails.
        Hold release handoff, publication, and rollout until all required gates pass. This checklist
        does not authorize publication or deployment. Keep the issue open until Operations completes
        the required records. If a fix changes the candidate, update the full SHA and ask each
        approval owner to record its result for that candidate.

        Record nonblocking suggestions separately. They do not block release approval.

  - type: textarea
    id: release-scope
    attributes:
      label: Release scope
      description: Name the repository, project owner, package, version, target branch, and release scope.
      placeholder: Describe the project and changes in this release.
    validations:
      required: true

  - type: input
    id: candidate-commit
    attributes:
      label: Final candidate commit
      description: Add the full pushed commit after it passes npm test, CI, and TagIt preflight.
      placeholder: Full candidate SHA
    validations:
      required: false

  - type: dropdown
    id: change-class
    attributes:
      label: Release class
      description: Set every v14 release class to Major. Derive other classes from the target version.
      options:
        - Major
        - Minor
        - Patch
    validations:
      required: true

  - type: checkboxes
    id: project-readiness
    attributes:
      label: Project readiness
      description: Update these project checks as results occur. Complete them before cross-role checks.
      options:
        - label: Complete dependency updates, documentation, README and AGENTS cleanup, and release notes.
        - label: Close all open repository issues found during the project issue review.
        - label: Complete CodeScope refactoring for applications and libraries, or state why it does not apply.
        - label: Complete CodeScope all and fix its reported issues. Do not run it again.
        - label: Push the final candidate and pass npm test, CI, and TagIt preflight.

  - type: textarea
    id: project-records
    attributes:
      label: Project readiness records
      description: Summarize the project checks and link related issues and validation results.
      placeholder: Start with the current status. Add dependency, issue, documentation, refactoring, CodeScope, test, CI, and TagIt results as work proceeds.
    validations:
      required: true

  - type: checkboxes
    id: marketing
    attributes:
      label: Marketing inspection
      description: Operations sends the request after Eli sends the issue.
      options:
        - label: Marketing inspected all Markdown files for branding, links, public copy, and consistency.
        - label: Marketing checked package identity, description, keywords, links, author, license, and funding.
        - label: Marketing ran and verified GitHub metadata sync after source checks passed.
        - label: Marketing completed every applicable check and linked all corrective issues in one result.
        - label: Marketing recorded files, fields, result, sync, and any issues.
        - label: Marketing rechecked changed Markdown and package fields on the final candidate.
        - label: Marketing checked prior issues and stated why unaffected checks are not repeated.
        - label: Marketing recorded its result for the current full candidate SHA.

  - type: textarea
    id: marketing-records
    attributes:
      label: Marketing records
      description: Record the full candidate SHA, coverage, result, and all issue links.
      placeholder: "List each status: pass, issue, not applicable, not repeated, or unverified. Link every issue."

  - type: checkboxes
    id: qa
    attributes:
      label: QA inspection
      description: Operations sends QA the request after Marketing reports its result.
      options:
        - label: QA inspected applicable conventions and project readiness for the final candidate.
        - label: QA recorded pass, issue, not applicable, not repeated, or unverified for every check.
        - label: QA completed every applicable check and linked all blockers in one result.
        - label: QA recorded its result for the same candidate that Marketing reviewed.
        - label: QA checked prior blockers and stated why unaffected checks are not repeated.
        - label: QA recorded its result for the current full candidate SHA.
        - label: Resolve QA blockers or record Eli's decision for each exception.

  - type: textarea
    id: qa-records
    attributes:
      label: QA records
      description: Record the full candidate SHA, coverage, QA result, and every blocker link.
      placeholder: "List each status: pass, issue, not applicable, not repeated, or unverified. Link all blockers."

  - type: checkboxes
    id: approval-and-publication
    attributes:
      label: Release authorization and publication
      description: Complete these steps after Marketing and QA pass the same candidate.
      options:
        - label: DevOps checked every applicable release record before reporting a blocker.
        - label: DevOps recorded a status for every applicable pre-publication check.
        - label: DevOps linked all corrective issues in one complete result.
        - label: Eli authorized publication of the candidate approved by Marketing and QA.
        - label: DevOps published the authorized candidate.
        - label: DevOps recorded the tag, workflow, registry result, and artifact details.
        - label: DevOps updated the Docs repository map.

  - type: textarea
    id: devops-checks
    attributes:
      label: DevOps pre-publication checks
      description: Record a status for each applicable check. Link all corrective issues in one result.
      placeholder: "List each status: pass, issue, not applicable, not repeated, or unverified. Include the candidate SHA."

  - type: textarea
    id: approval-publication-records
    attributes:
      label: Authorization and publication records
      description: Link Eli's authorization, publication results, and the updated repository map.
      placeholder: Record the published version, commit, tag, artifact, and links.

  - type: dropdown
    id: ghcr-publication
    attributes:
      label: GHCR publication
      description: GitOps applies to a release only when this repository publishes an image to GHCR.
      options:
        - This repository does not publish an image to GHCR
        - This repository publishes an image to GHCR
    validations:
      required: true

  - type: checkboxes
    id: deployment-handoff
    attributes:
      label: GitOps handoff
      description: Complete these gates only when this release publishes an image to GHCR and Eli approves the handoff.
      options:
        - label: Operations handed the approved deployment to GitOps after DevOps confirmed publication.
        - label: GitOps recorded the approved commit, artifact digest, checks, and rollout result.
        - label: GitOps linked any follow-up issue and returned the result to Operations.

  - type: textarea
    id: deployment-records
    attributes:
      label: Deployment records
      description: Record why GitOps does not apply, or link Eli's approval and rollout results.
      placeholder: Record GHCR publication and the GitOps result.

  - type: checkboxes
    id: closure
    attributes:
      label: Closure
      description: DevOps closes without a GHCR image. Operations closes after GitOps records a GHCR image rollout.
      options:
        - label: DevOps recorded publication and closed this issue because no GHCR image was published.
        - label: Operations recorded the GitOps rollout and closed this issue after GHCR publication.
