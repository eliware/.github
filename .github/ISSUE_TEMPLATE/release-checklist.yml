name: Release checklist
description: Record project readiness, cross-role reviews, authorization, publication, and deployment.
title: "Release checklist"
body:
  - type: markdown
    attributes:
      value: >-
        The project agent opens and owns this issue at the start of release work, before readiness
        checks. Include the release version in the title. Record readiness results as work proceeds.
        Add the full candidate commit after project checks pass and before cross-role inspections. Keep
        the follow-up candidate separate from any previously published tag. Send the completed
        checklist to Operations for coordination. Eli or Operations can start Marketing inspection
        after readiness is recorded. Use the repository name as the project owner.
        Operations coordinates Marketing, QA, DevOps, and GitOps when deployment applies.

        The project owner can commit and push corrective fixes while a gate fails.
        Hold release handoff, publication, and rollout until all required gates pass. This checklist
        does not authorize publication or deployment. Keep the issue open until Operations completes
        the required records. If a fix changes the candidate, update the full SHA and ask each
        approval owner to record its result for that candidate.

        Record nonblocking suggestions separately. They do not block release approval.

  - type: textarea
    id: release-scope
    attributes:
      label: Release scope
      description: Name the repository, project owner, package, version, target branch, and release scope.
      placeholder: Describe the project and changes in this release.
    validations:
      required: true

  - type: input
    id: candidate-commit
    attributes:
      label: Final candidate commit
      description: Add the full pushed commit after it passes npm test, CI, and TagIt preflight.
      placeholder: Full candidate SHA
    validations:
      required: false

  - type: dropdown
    id: change-class
    attributes:
      label: Release class
      description: Set every v15 release class to Major. Derive other classes from the target version.
      options:
        - Major
        - Minor
        - Patch
    validations:
      required: true

  - type: checkboxes
    id: project-readiness
    attributes:
      label: Project readiness
      description: Update these project checks as results occur. Complete them before cross-role checks.
      options:
        - label: Complete dependency updates, documentation, README and AGENTS cleanup, and release notes.
        - label: Close all open repository issues found during the project issue review.
        - label: Complete CodeScope refactoring for applications and libraries, or state why it does not apply.
        - label: Complete CodeScope all and fix its reported issues. Do not run it again.
        - label: Push the final candidate and pass npm test, CI, and TagIt preflight.

  - type: textarea
    id: project-records
    attributes:
      label: Project readiness records
      description: Summarize the project checks and link related issues and validation results.
      placeholder: Start with the current status. Add dependency, issue, documentation, refactoring, CodeScope, test, CI, and TagIt results as work proceeds.
    validations:
      required: true

  - type: checkboxes
    id: marketing
    attributes:
      label: Marketing inspection
      description: Eli or Operations can start Marketing inspection after project readiness is recorded.
      options:
        - label: Marketing inspected every tracked Markdown file and presentation for branding, public copy, and consistency.
        - label: Marketing checked every local link and fragment in all Markdown files.
        - label: Marketing checked every external link, image, and badge. Broken or unverified links block PASS.
        - label: Marketing matched map ID to eliware.id and profiles to eliware.apply.
        - label: Marketing checked eliware.exempt when that package field exists.
        - label: Marketing matched map description and keywords to package fields.
        - label: Marketing matched README description to package.json description.
        - label: Marketing checked package name, version, homepage, repository URL, bugs URL, author, license, funding, and publication settings.
        - label: Marketing synced and verified GitHub description, homepage, and topics against source values.
        - label: Marketing completed every applicable check and linked all corrective issues in one result.
        - label: Marketing recorded each file, link, field, sync result, and issue status.
        - label: Marketing rechecked changed items and stated why unchanged checks were not repeated.
        - label: Marketing checked prior issues and stated why unaffected checks are not repeated.
        - label: Marketing recorded its result for the current full candidate SHA.

  - type: textarea
    id: marketing-records
    attributes:
      label: Marketing records
      description: Record the candidate SHA, per-file and per-field status, link results, metadata sync, outcome, and issue links.
      placeholder: "List each status: pass, issue, not applicable, not repeated, or unverified. Link every issue."

  - type: checkboxes
    id: qa
    attributes:
      label: QA inspection
      description: Operations sends QA the request after Marketing reports its result.
      options:
        - label: QA inspected applicable conventions and project readiness for the final candidate.
        - label: QA recorded pass, issue, not applicable, not repeated, or unverified for every check.
        - label: QA completed every applicable check and linked all blockers in one result.
        - label: QA recorded its result for the same candidate that Marketing reviewed.
        - label: QA checked prior blockers and stated why unaffected checks are not repeated.
        - label: QA recorded its result for the current full candidate SHA.
        - label: Resolve QA blockers or record Eli's decision for each exception.

  - type: textarea
    id: qa-records
    attributes:
      label: QA records
      description: Record the full candidate SHA, coverage, QA result, and every blocker link.
      placeholder: "List each status: pass, issue, not applicable, not repeated, or unverified. Link all blockers."

  - type: checkboxes
    id: approval-and-publication
    attributes:
      label: Release authorization and publication
      description: Complete these steps after Marketing and QA pass the same candidate.
      options:
        - label: DevOps checked every applicable release record before reporting a blocker.
        - label: DevOps recorded a status for every applicable pre-publication check.
        - label: DevOps linked all corrective issues in one complete result.
        - label: Operations sent one authorized handoff after Marketing and QA passed the same candidate and TagIt passed.
        - label: DevOps verified the handoff, checklist, and Eli authorization for the exact repository, version, candidate, and action.
        - label: DevOps verified Marketing, QA, and TagIt records name the same full candidate SHA.
        - label: Eli authorized publication of the candidate approved by Marketing and QA.
        - label: DevOps recorded the reviewed candidate separately from the release commit and tag target.
        - label: DevOps published the authorized candidate.
        - label: DevOps recorded the tag, workflow, registry result, and artifact details.
        - label: DevOps recorded the published package version and successful workflow evidence.
        - label: DevOps recorded the GHCR workflow, image digest, registry digest check, and immutable digest inspection when applicable.
        - label: DevOps updated the Docs repository map.

  - type: textarea
    id: operations-devops-handoff
    attributes:
      label: Operations to DevOps handoff
      description: Record one handoff after Marketing and QA pass the same candidate and TagIt preflight passes.
      placeholder: "Link the checklist. Record repository, version, full candidate SHA, Marketing result, QA result, TagIt preflight result, and Eli's authorization for the exact release action."

  - type: textarea
    id: devops-checks
    attributes:
      label: DevOps pre-publication checks
      description: Verify the handoff and authorization. Record each check and link all blockers in one result.
      placeholder: "Record each status and the full source candidate SHA. For npm, record the package version and workflow result. For GHCR, record the workflow result, image digest, registry digest check, and immutable digest inspection. Do not require attestations. Link all blockers."

  - type: textarea
    id: approval-publication-records
    attributes:
      label: Authorization and publication records
      description: Link Eli's authorization, publication results, and the updated repository map.
      placeholder: Record the approved source SHA separately from the release commit and tag target. Record the package version, workflow result, artifact, and links.

  - type: dropdown
    id: ghcr-publication
    attributes:
      label: GHCR publication
      description: GitOps applies to a release only when this repository publishes an image to GHCR.
      options:
        - This repository does not publish an image to GHCR
        - This repository publishes an image to GHCR
    validations:
      required: true

  - type: checkboxes
    id: deployment-handoff
    attributes:
      label: GitOps handoff
      description: Complete these gates only for GHCR releases. Eli first approves inspection, then approves the exact GitOps change.
      options:
        - label: Operations handed the approved deployment to GitOps after DevOps confirmed publication.
        - label: GitOps verified the source candidate SHA against Marketing, QA, and DevOps records.
        - label: GitOps checked all applicable deployment requirements before reporting a blocker.
        - label: GitOps recorded the published image digest, registry digest check, immutable digest inspection, and rollout result.
        - label: GitOps linked every corrective issue in one complete result.
        - label: GitOps reported the inspected change, checks, risks, and proposed action to Eli and Operations.
        - label: Eli authorized the exact GitOps change after reviewing its diff, checks, and risks.
        - label: GitOps committed and pushed only the exact change Eli authorized.
        - label: GitOps linked any follow-up issue and returned the result to Operations.

  - type: textarea
    id: deployment-records
    attributes:
      label: Deployment records
      description: Record why GitOps does not apply, or link Eli's approval and rollout results.
      placeholder: Record the full candidate SHA, GHCR workflow result, image digest, registry digest check, immutable digest inspection, every blocker, and rollout result. Do not require attestations.

  - type: checkboxes
    id: closure
    attributes:
      label: Closure
      description: DevOps closes without a GHCR image. Operations closes after GitOps records a GHCR image rollout.
      options:
        - label: DevOps recorded publication and closed this issue because no GHCR image was published.
        - label: Operations recorded the GitOps rollout and closed this issue after GHCR publication.
