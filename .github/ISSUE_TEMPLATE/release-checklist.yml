name: Release checklist
description: Record project readiness, cross-role reviews, authorization, publication, and deployment.
title: "Release checklist"
body:
  - type: markdown
    attributes:
      value: >-
        The project agent creates this issue after the final candidate passes TagIt preflight.
        Include the release version in the title. Complete the project readiness checks before
        handoff. Eli sends the checklist to Operations. Operations then coordinates Marketing, QA,
        DevOps, and GitOps when deployment applies. This checklist does not authorize publication
        or deployment. Keep the issue open until Operations completes the required records.

  - type: textarea
    id: release-scope
    attributes:
      label: Release scope
      description: Name the repository, project owner, package, version, target branch, and release scope.
      placeholder: Describe the project and changes in this release.
    validations:
      required: true

  - type: input
    id: candidate-commit
    attributes:
      label: Final candidate commit
      description: Record the full pushed commit that passed npm test, CI, and TagIt preflight.
      placeholder: Full candidate SHA
    validations:
      required: true

  - type: dropdown
    id: change-class
    attributes:
      label: Release class
      description: Set every v13 release class to Major. Derive other classes from the target version.
      options:
        - Major
        - Minor
        - Patch
    validations:
      required: true

  - type: checkboxes
    id: project-readiness
    attributes:
      label: Project readiness
      description: Complete these project checks before Operations starts cross-role checks.
      options:
        - label: Complete dependency updates, documentation, README and AGENTS cleanup, and release notes.
        - label: Close all open repository issues found during the project issue review.
        - label: Complete CodeScope refactoring for applications and libraries, or state why it does not apply.
        - label: Complete CodeScope all and fix its reported issues. Do not run it again.
        - label: Push the final candidate and pass npm test, CI, and TagIt preflight.

  - type: textarea
    id: project-records
    attributes:
      label: Project readiness records
      description: Summarize the project checks and link related issues and validation results.
      placeholder: Include dependency, issue, documentation, refactoring, CodeScope, test, CI, and TagIt results.
    validations:
      required: true

  - type: checkboxes
    id: marketing
    attributes:
      label: Marketing inspection
      description: Operations sends the request after Eli sends the issue.
      options:
        - label: Marketing inspected README presentation, branding, links, and public copy for the candidate.
        - label: Marketing recorded its result and linked any findings.
        - label: Marketing confirmed the final candidate or rechecked presentation after a change.

  - type: textarea
    id: marketing-records
    attributes:
      label: Marketing records
      description: Record the full candidate SHA, inspection result, accepted exceptions, and issue links.
      placeholder: Add Marketing's inspection result and issues.

  - type: checkboxes
    id: qa
    attributes:
      label: QA inspection
      description: Operations sends QA the request after Marketing reports its result.
      options:
        - label: QA inspected applicable conventions and project readiness for the final candidate.
        - label: QA recorded its result for the same candidate that Marketing reviewed.
        - label: Resolve QA blockers or record Eli's decision for each exception.

  - type: textarea
    id: qa-records
    attributes:
      label: QA records
      description: Record the full candidate SHA, QA result, and links to any findings.
      placeholder: Add QA's review result and findings.

  - type: checkboxes
    id: approval-and-publication
    attributes:
      label: Release authorization and publication
      description: Complete these steps after Marketing and QA pass the same candidate.
      options:
        - label: Eli authorized publication of the candidate approved by Marketing and QA.
        - label: DevOps published the authorized candidate.
        - label: DevOps recorded the tag, workflow, registry result, and artifact details.
        - label: DevOps updated the Docs repository map.

  - type: textarea
    id: approval-publication-records
    attributes:
      label: Authorization and publication records
      description: Link Eli's authorization, publication results, and the updated repository map.
      placeholder: Record the published version, commit, tag, artifact, and links.

  - type: dropdown
    id: deployment-required
    attributes:
      label: Deployment requirement
      description: State if this release requires a GitOps deployment.
      options:
        - No deployment is required
        - Deployment is required
    validations:
      required: true

  - type: checkboxes
    id: deployment-handoff
    attributes:
      label: GitOps handoff
      description: Complete these gates only when deployment applies and Eli approves the handoff.
      options:
        - label: Operations handed the approved deployment to GitOps after DevOps confirmed publication.
        - label: GitOps recorded the approved commit, artifact digest, checks, and rollout result.
        - label: GitOps linked any follow-up issue and returned the result to Operations.

  - type: textarea
    id: deployment-records
    attributes:
      label: Deployment records
      description: Record why deployment does not apply, or link Eli's approval and GitOps results.
      placeholder: Record the deployment decision and result.

  - type: checkboxes
    id: closure
    attributes:
      label: Closure
      description: Operations closes this issue after every applicable gate is complete.
      options:
        - label: Operations confirmed the required records and closed this issue.
