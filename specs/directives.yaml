version: "13.0"
description: Eliware GitHub community health files and organization profile.
directives:
  - id: E-1.0
    dos:
      - This repository owns GitHub community health files and the Eliware organization profile.
      - Keep shared files general.
      - Let each target repository set its project rules, code, and settings.
      - Link to the Eliware repository that owns each rule or process.
      - Keep those rules in their owning repository.
    donts:
      - Do not let shared defaults replace target repository rules or settings.
      - Keep credentials, secrets, and private operational details out of tracked content.
      - Keep machine-specific state out of tracked content.
